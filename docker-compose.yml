version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sporteam-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sporteam
      POSTGRES_USER: sporteam
      POSTGRES_PASSWORD: sporteam_pass

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sporteam-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://sporteam:sporteam_pass@postgres:5432/sporteam"
      JWT_SECRET: "${JWT_SECRET:-cambia-esta-secret-key-en-produccion}"
      CLIENT_ID: "${CLIENT_ID:-}"
      CLOUDINARY_URL: "${CLOUDINARY_URL:-}"
    depends_on:
      - postgres

volumes:
  postgres-data:
